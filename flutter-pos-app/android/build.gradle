allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.file("../build")
subprojects {
    project.buildDir = "${newBuildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
