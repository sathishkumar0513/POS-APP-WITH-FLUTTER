name: flutter_pos
description: Offline POS Application with Bluetooth Printer Support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  image_picker: ^1.1.2
  permission_handler: ^11.4.0

  # Bluetooth + thermal printer
  flutter_bluetooth_serial: ^0.4.0
  esc_pos_utils: ^1.1.0
  esc_pos_bluetooth: ^0.4.1

  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
